<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clearlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2e28;
      --ink-soft: #3d5a52;
      --muted: #6b857c;
      --paper: #f3f7f4;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-solid: #ffffff;
      --line: rgba(26, 46, 40, 0.1);
      --accent: #0f766e;
      --accent-hover: #0d5f59;
      --accent-soft: rgba(15, 118, 110, 0.12);
      --danger: #b4533a;
      --danger-soft: rgba(180, 83, 58, 0.1);
      --shadow: 0 18px 50px rgba(26, 46, 40, 0.08);
      --radius: 16px;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Outfit", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(45, 155, 140, 0.22), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 10%, rgba(212, 168, 90, 0.18), transparent 50%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(15, 118, 110, 0.12), transparent 55%),
        linear-gradient(165deg, #e8f2ee 0%, #f6f3eb 45%, #eef4f1 100%);
      background-attachment: fixed;
    }

    .noise {
      pointer-events: none;
      position: fixed;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(560px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 3.5rem 0 4rem;
      animation: rise 0.7s ease both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .brand {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 7vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--ink);
      animation: brandIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes brandIn {
      from {
        opacity: 0;
        letter-spacing: 0.08em;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        letter-spacing: -0.03em;
        transform: translateY(0);
      }
    }

    .tagline {
      margin-top: 0.65rem;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 400;
      animation: rise 0.8s 0.12s ease both;
    }

    .composer {
      display: flex;
      gap: 0.65rem;
      padding: 0.55rem;
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow);
      animation: rise 0.8s 0.2s ease both;
    }

    .composer input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.85rem 1rem;
      font: inherit;
      font-size: 1rem;
      color: var(--ink);
      outline: none;
    }

    .composer input::placeholder {
      color: var(--muted);
    }

    .composer button {
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1.25rem;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .composer button:hover {
      background: var(--accent-hover);
    }

    .composer button:active {
      transform: scale(0.97);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 1.5rem 0 0.85rem;
      animation: rise 0.8s 0.28s ease both;
    }

    .count {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .filters {
      display: flex;
      gap: 0.25rem;
    }

    .filters button {
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.4rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .filters button:hover {
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.5);
    }

    .filters button.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      animation: rise 0.8s 0.34s ease both;
    }

    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 0.85rem;
      padding: 0.95rem 1rem;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(26, 46, 40, 0.04);
      animation: itemIn 0.35s ease both;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .item:hover {
      border-color: rgba(15, 118, 110, 0.25);
      box-shadow: 0 8px 24px rgba(26, 46, 40, 0.07);
    }

    @keyframes itemIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .item.leaving {
      animation: itemOut 0.25s ease forwards;
    }

    @keyframes itemOut {
      to {
        opacity: 0;
        transform: translateX(12px) scale(0.97);
      }
    }

    .check {
      width: 1.35rem;
      height: 1.35rem;
      border: 2px solid rgba(15, 118, 110, 0.45);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
      flex-shrink: 0;
    }

    .check:hover {
      border-color: var(--accent);
      transform: scale(1.05);
    }

    .check svg {
      width: 0.75rem;
      height: 0.75rem;
      opacity: 0;
      stroke: white;
      stroke-width: 3;
      fill: none;
      transition: opacity 0.15s ease;
    }

    .item.done .check {
      background: var(--accent);
      border-color: var(--accent);
    }

    .item.done .check svg {
      opacity: 1;
    }

    .text {
      font-size: 1.02rem;
      line-height: 1.4;
      word-break: break-word;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .item.done .text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      opacity: 0.75;
    }

    .delete {
      width: 2rem;
      height: 2rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .item:hover .delete,
    .item:focus-within .delete {
      opacity: 1;
    }

    .delete:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 1rem;
      border: 1px dashed rgba(26, 46, 40, 0.18);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.35);
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 1rem;
      min-height: 1.5rem;
    }

    .clear-done {
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .clear-done:hover {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .clear-done[hidden] {
      display: none;
    }

    @media (max-width: 480px) {
      .app {
        padding-top: 2.25rem;
      }

      .composer {
        flex-direction: column;
      }

      .composer button {
        width: 100%;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .filters {
        justify-content: space-between;
      }

      .delete {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main class="app">
    <header>
      <h1 class="brand">Clearlist</h1>
      <p class="tagline">Capture what’s next. Cross it off.</p>
    </header>

    <form class="composer" id="form" autocomplete="off">
      <input
        id="input"
        type="text"
        placeholder="Add a task…"
        maxlength="200"
        aria-label="New task"
      />
      <button type="submit">Add</button>
    </form>

    <div class="toolbar">
      <p class="count" id="count">0 tasks left</p>
      <div class="filters" role="tablist" aria-label="Filter tasks">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="done">Done</button>
      </div>
    </div>

    <ul class="list" id="list" aria-live="polite"></ul>

    <div class="footer-actions">
      <button type="button" class="clear-done" id="clearDone" hidden>Clear completed</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "clearlist-todos-v1";

    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const list = document.getElementById("list");
    const countEl = document.getElementById("count");
    const clearDoneBtn = document.getElementById("clearDone");
    const filterButtons = document.querySelectorAll(".filters button");

    let todos = loadTodos();
    let filter = "all";

    function loadTodos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function uid() {
      return crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now()) + Math.random().toString(16).slice(2);
    }

    function remainingCount() {
      return todos.filter((t) => !t.done).length;
    }

    function visibleTodos() {
      if (filter === "active") return todos.filter((t) => !t.done);
      if (filter === "done") return todos.filter((t) => t.done);
      return todos;
    }

    function render() {
      const items = visibleTodos();
      list.innerHTML = "";

      if (items.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent =
          filter === "done"
            ? "No completed tasks yet."
            : filter === "active"
              ? "Nothing left — nice work."
              : "Your list is clear. Add something above.";
        list.appendChild(empty);
      } else {
        for (const todo of items) {
          list.appendChild(createItem(todo));
        }
      }

      const left = remainingCount();
      countEl.textContent = left === 1 ? "1 task left" : `${left} tasks left`;

      const hasDone = todos.some((t) => t.done);
      clearDoneBtn.hidden = !hasDone;
    }

    function createItem(todo) {
      const li = document.createElement("li");
      li.className = "item" + (todo.done ? " done" : "");
      li.dataset.id = todo.id;

      const check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", todo.done ? "Mark as active" : "Mark as done");
      check.innerHTML =
        '<svg viewBox="0 0 12 12" aria-hidden="true"><polyline points="2,6 5,9 10,3"/></svg>';
      check.addEventListener("click", () => toggleTodo(todo.id));

      const text = document.createElement("span");
      text.className = "text";
      text.textContent = todo.text;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "delete";
      del.setAttribute("aria-label", "Delete task");
      del.textContent = "×";
      del.addEventListener("click", () => removeTodo(todo.id, li));

      li.append(check, text, del);
      return li;
    }

    function addTodo(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      todos.unshift({ id: uid(), text: trimmed, done: false });
      saveTodos();
      render();
    }

    function toggleTodo(id) {
      todos = todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t));
      saveTodos();
      render();
    }

    function removeTodo(id, li) {
      li.classList.add("leaving");
      setTimeout(() => {
        todos = todos.filter((t) => t.id !== id);
        saveTodos();
        render();
      }, 220);
    }

    function clearCompleted() {
      todos = todos.filter((t) => !t.done);
      saveTodos();
      render();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      addTodo(input.value);
      input.value = "";
      input.focus();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        filterButtons.forEach((b) => b.classList.toggle("active", b === btn));
        render();
      });
    });

    clearDoneBtn.addEventListener("click", clearCompleted);

    render();
    input.focus();
  </script>
</body>
</html>
