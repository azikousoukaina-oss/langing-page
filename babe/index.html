<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1412" />
  <meta name="description" content="Babe — private AI messenger in Egyptian dialect. Installable web app." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Babe" />
  <title>Babe — وكيلك الخاص</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="phone" id="app">
    <header class="topbar">
      <div class="identity">
        <div class="avatar" aria-hidden="true">
          <span class="avatar-glow"></span>
          <span class="avatar-letter">B</span>
        </div>
        <div class="identity-text">
          <h1 class="brand">Babe</h1>
          <p class="status" id="statusLine">
            <span class="pulse"></span>
            خاص · معاك دلوقتي
          </p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="installBtn" title="حمّل التطبيق" aria-label="حمّل التطبيق" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button type="button" class="icon-btn" id="speakToggle" title="تشغيل الصوت" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M16 9a4 4 0 010 6"/><path d="M18.5 7a7 7 0 010 10"/></svg>
        </button>
        <button type="button" class="icon-btn" id="settingsBtn" title="الإعدادات" aria-label="الإعدادات">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="thread" id="thread" aria-live="polite"></main>

    <div class="typing" id="typing" hidden>
      <span></span><span></span><span></span>
      <em>Babe بيكتب…</em>
    </div>

    <form class="composer" id="composer">
      <button type="button" class="mic-btn" id="micBtn" title="اتكلم" aria-label="تسجيل صوت">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
      </button>
      <label class="sr-only" for="input">رسالتك</label>
      <textarea id="input" rows="1" placeholder="اكتب لـ Babe…" enterkeyhint="send" autocomplete="off"></textarea>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="إرسال">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3.4 11.2l16.2-7.1c.7-.3 1.4.4 1.1 1.1l-7.1 16.2c-.3.8-1.5.7-1.7-.1l-1.6-6.3-6.3-1.6c-.8-.2-.9-1.4-.1-1.7z"/></svg>
      </button>
    </form>
  </div>

  <aside class="sheet" id="settingsSheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-labelledby="settingsTitle">
      <div class="sheet-head">
        <h2 id="settingsTitle">إعدادات Babe</h2>
        <button type="button" class="icon-btn" data-close aria-label="إغلاق">✕</button>
      </div>
      <p class="sheet-lead">محادثتك بتتخزن على جهازك بس. Babe وكيل خاص ليك.</p>
      <label class="field">
        <span>مفتاح API (اختياري)</span>
        <input type="password" id="apiKey" placeholder="لو عندك مفتاح OpenAI-compatible" autocomplete="off" />
      </label>
      <label class="field">
        <span>عنوان الـ API (اختياري)</span>
        <input type="url" id="apiBase" placeholder="افتراضي: Pollinations مجاني" />
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="autoSpeak" checked />
        <span>Babe يرد بصوته</span>
      </label>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="clearChat">امسح الشات</button>
        <button type="button" class="btn primary" id="saveSettings">حفظ</button>
      </div>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
