<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071016" />
  <meta name="description" content="Mesh — free always-on AI. Talk about anything. Many modes. No waiting." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mesh" />
  <title>Mesh — talk about anything</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="mesh-bg" aria-hidden="true"></div>

  <div class="shell" id="app">
    <header class="top">
      <div class="brand-block">
        <div class="logo" aria-hidden="true">
          <span class="node"></span><span class="node"></span><span class="node"></span>
        </div>
        <div>
          <h1 class="brand">Mesh</h1>
          <p class="tagline" id="statusLine">Free · always on · talk about anything</p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="chip-btn" id="modesBtn" title="Modes">Modes</button>
        <button type="button" class="icon-btn" id="installBtn" title="Install" hidden>↓</button>
        <button type="button" class="icon-btn" id="clearBtn" title="New chat">↻</button>
      </div>
    </header>

    <section class="modes-strip" id="modesStrip" aria-label="Chat modes">
      <!-- filled by JS -->
    </section>

    <main class="thread" id="thread" aria-live="polite"></main>

    <div class="queue-bar" id="queueBar" hidden>
      <span class="spinner"></span>
      <span id="queueText">Mesh is answering in the background…</span>
      <em>keep typing — you don’t have to wait</em>
    </div>

    <form class="composer" id="composer">
      <button type="button" class="mic-btn" id="micBtn" title="Talk" aria-label="Voice input">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Ask Mesh anything — free, no limits…" enterkeyhint="send"></textarea>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3.4 11.2l16.2-7.1c.7-.3 1.4.4 1.1 1.1l-7.1 16.2c-.3.8-1.5.7-1.7-.1l-1.6-6.3-6.3-1.6c-.8-.2-.9-1.4-.1-1.7z"/></svg>
      </button>
    </form>
  </div>

  <aside class="drawer" id="modesDrawer" hidden>
    <div class="drawer-backdrop" data-close-drawer></div>
    <div class="drawer-panel" role="dialog" aria-labelledby="modesTitle">
      <div class="drawer-head">
        <h2 id="modesTitle">Choose a mode</h2>
        <button type="button" class="icon-btn" data-close-drawer aria-label="Close">✕</button>
      </div>
      <p class="drawer-lead">Pick how Mesh should help. Switch anytime — conversation keeps going.</p>
      <div class="mode-grid" id="modeGrid"></div>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
